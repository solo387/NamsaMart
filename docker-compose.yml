services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-namsamart}
      POSTGRES_USER: ${POSTGRES_USER:-namsamart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-namsamart} -d ${POSTGRES_DB:-namsamart}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: 1
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DATABASE_URL: postgresql://${POSTGRES_USER:-namsamart}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-namsamart}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres_data:
